<nav class="main-header navbar navbar-expand navbar-white navbar-light nav_top">
    <ul class="navbar-nav">
      <li class="nav-item" style="padding-right: 5px;padding-left: 5px;">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars" style="color: #fff;"></i></a>
      </li>
      <li class="nav-item d-sm-inline-block d-md-none">
        <img src="assets/img/logo/letra2.png" style="width: 130px;" loading="lazy" >
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a href="index3.html" class="nav-link">Home</a>
      </li>
    </ul> 
    <ul class="navbar-nav ml-auto d-flex align-items-center">

      <!-- BOTÓN SWITCH MODO OSCURO / MODO CLARO -->
      <li class="nav-item mr-3">
        <button 
          type="button" 
          class="btn-theme-nav" 
          (click)="toggleTheme()" 
          [matTooltip]="isDarkMode ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro'">
          <mat-icon class="icon-sun" *ngIf="isDarkMode">light_mode</mat-icon>
          <mat-icon class="icon-moon" *ngIf="!isDarkMode">dark_mode</mat-icon>
          <span class="theme-text d-none d-md-inline">{{ isDarkMode ? 'Modo Claro' : 'Modo Oscuro' }}</span>
        </button>
      </li>

      <li class="nav-item" style="margin-right: -12px;" [matMenuTriggerFor]="menu">
        <a class="nav-link" data-widget="control-sidebar" data-controlsidebar-slide="true" href="#" role="button" style="padding-top: 15px;">
          <span style="font-weight: 500;color: #fff;">José Luis</span>
        </a>
      </li> 

      <button mat-icon-button [matMenuTriggerFor]="menu" style="margin-right: 4px;">
        <mat-icon style="color: #fff;">account_circle</mat-icon>
      </button>

      <mat-menu #menu="matMenu">
        <!-- Opción de Tema dentro del Menú -->
        <button mat-menu-item (click)="toggleTheme()">
          <mat-icon [style.color]="isDarkMode ? '#fbbf24' : '#64748b'">
            {{ isDarkMode ? 'light_mode' : 'dark_mode' }}
          </mat-icon>
          <span>{{ isDarkMode ? 'Cambiar a Modo Claro' : 'Cambiar a Modo Oscuro' }}</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="dataUser()">
          <mat-icon>account_box</mat-icon>
          <span>Mis datos</span>
        </button>
        <button mat-menu-item (click)="logout()">
          <mat-icon>output</mat-icon>
          <span>Salir del sistema</span>
        </button>
      </mat-menu>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-2" style="background: #113C68; height: 100vh !important;overflow-y: hidden;z-index: 1038;bottom: 0;float: none;left: 0;position: fixed !important;top: 0 !important;">
    <div class="brand-link" style="display: flex;justify-content: space-around;align-items: center; padding-bottom: 4px;padding-top: 4px;">
      <img src="assets/img/logo/letra3.png" style="width: 167px;" loading="lazy">
      <button class="pr-0" mat-icon-button data-widget="pushmenu" href="#" role="button" matTooltip="Ocultar Menú">
        <mat-icon class="nav_icon" style="color: #fff;">keyboard_double_arrow_left</mat-icon>
      </button>
    </div>
    <div class="sidebar" style="display: flex; flex-direction: column;">
      <nav class="mt-2" style="flex: 1; overflow-y: auto;">
        <mat-nav-list>
          <ng-container *ngFor="let menu of menuItems">
            <!-- Si tiene submenús, usa mat-expansion-panel -->
            <mat-expansion-panel *ngIf="menu.subItems?.length > 0; else singleItem">
              <mat-expansion-panel-header>
                <mat-panel-title style="color: #fff;">
                  <mat-icon class="nav_icon" style="color: #fff;">{{ menu.icon }}</mat-icon>
                  &nbsp;&nbsp;&nbsp;{{ menu.title }}
                </mat-panel-title>
              </mat-expansion-panel-header>
              
              <mat-list-item *ngFor="let subItem of menu.subItems">
                <a mat-button [routerLink]="subItem.route" routerLinkActive="active-link">
                  <mat-icon class="nav_icon" style="color: #fff;">{{ subItem.icon }}</mat-icon>
                  {{ subItem.title }}
                </a>
              </mat-list-item>
            </mat-expansion-panel>
            <!-- Si NO tiene submenús, se renderiza como enlace directo -->
            <ng-template #singleItem>
              <mat-list-item>
                <a mat-button [routerLink]="menu.route" routerLinkActive="active-link">
                  <mat-icon class="nav_icon" style="color: #fff;font-size: 24px;width: 24px;height: 24px;">{{ menu.icon }}</mat-icon>
                  {{ menu.title }}
                </a>
              </mat-list-item>
            </ng-template>
          </ng-container>
        </mat-nav-list>
      </nav>
      <div style="border-top: 1px solid rgba(255,255,255,0.1); padding: 8px;">
        <div>
          <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión" class="btn_salir_menu">
            <mat-icon>output</mat-icon> &nbsp;Salir del sistema 
          </button>
        </div>
      </div>
    </div>
  </aside>
  <div class="content-wrapper">
    <section class="content section-body-contect-router">
      <router-outlet></router-outlet>
    </section>
  </div>
