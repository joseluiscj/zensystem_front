<div class="wrap-title-with-buttons m-layout-section section-home" style="padding-top: 10px;">
  <div class="m-section-title">
      <h4 class="m-title mb-1">Gestión de Caja</h4>
      <div class="m-title-description">Desde aquí puedes gestionar tus Cajas.</div>
  </div>
  <div class="m-section-buttons " align="center">
      <button mat-raised-button  (click)="openDialog()" class="btn_p btn_primary" >
          <mat-icon>add</mat-icon> Nueva Categoría
      </button>
  </div>  
</div> 
<mat-expansion-panel [(expanded)]="isPanelOpen" class="expansion-panel-below-button m-3" style="border-radius: 8px;">
  <mat-expansion-panel-header>
    <mat-panel-title>
      <mat-icon>manage_search</mat-icon> &nbsp;
      Filtrar información por:
    </mat-panel-title> 
  </mat-expansion-panel-header>
  <form [formGroup]="basicForm" (ngSubmit)="btnBuscar()">
    <div class="row"> 
      <div class="col-md-5">
        <mat-form-field appearance="fill" class="custom-input" style="width: 100%; height: 70px;">
          <mat-label class="labeltext">Nombre:</mat-label>
          <input matInput placeholder="Escribir..." formControlName="nombres" autocomplete="off" maxlength="30">
        </mat-form-field>
      </div>
      <div class="col-md-3 btn_boton_filter">
        <div align="center" style="display: flex; align-items: center;">
          <button mat-raised-button color="primary" type="submit" class="btn_primary" style="height: 32px;">
            <mat-icon>search</mat-icon>Buscar
          </button> &nbsp;
          <button mat-raised-button (click)="onClear()" class="btn_secondary"  style="height: 32px;">
            <mat-icon>disabled_by_default</mat-icon>Limpiar
          </button>
        </div>
      </div>
    </div>
  </form>
</mat-expansion-panel>

<div style="margin: 10px 28px;" *ngIf="cargaContenido">
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
</div>

<div class="content_body_web">
    <div class="row m-2" style="justify-content: center;">
      <div class="col-md-12">
        <mat-card class="p-0 stable"  >
          <mat-card-content class=" "> 
            <div class="table-container small-font-table" style="overflow-x: auto;border-radius: 10px;">
              <table mat-table [dataSource]="dataSource" matSort>
                <ng-container matColumnDef="#">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> # </th>
                  <td mat-cell *matCellDef="let row; let i = index"> {{getRowNumber(i)}} </td>
                </ng-container> 
  
                <ng-container matColumnDef="sucursal">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Sucursal </th>
                  <td mat-cell *matCellDef="let row"> {{row.sucursal}} </td>
                </ng-container>   
                <ng-container matColumnDef="nombre">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Nombre </th>
                  <td mat-cell *matCellDef="let row"> {{row.nombre}} </td>
                </ng-container>  
                <ng-container matColumnDef="tipoCaja">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
                  <td mat-cell *matCellDef="let row"> {{row.tipoCaja}} </td>
                </ng-container>  
                <ng-container matColumnDef="saldo">
                  <th mat-header-cell *matHeaderCellDef mat-sort-header> Saldo </th>
                  <td mat-cell *matCellDef="let row"> {{row.saldo}} </td>
                </ng-container>  
  
                <ng-container matColumnDef="actions">
                  <th mat-header-cell *matHeaderCellDef style="text-align: center;">Acción</th>
                  <td mat-cell *matCellDef="let row">
                    <div style="display: flex;justify-content: space-evenly;">
                      <button mat-raised-button (click)="openDialog(row.id)" class="small-buttonc btn_action"
                        matTooltip="Editar Información">
                        <mat-icon class="m-0" style="color: #1D95A8 !important;">edit_square</mat-icon> Actualizar
                      </button>&nbsp;&nbsp; 
   
                      <button  mat-raised-button (click)="deletDialog(row.id)" class="small-buttonc btn_delete"
                        matTooltip="Eliminar">
                        <mat-icon class="m-0" style="color: #EB5757 !important;">delete</mat-icon> Eliminar
                      </button>
                    </div>
                  </td>
                </ng-container>
  
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; let i = index; columns: displayedColumns;"
                  [ngClass]="getRowClass(i)">
                </tr>
           
              </table>
            </div>
            <mat-paginator [pageSizeOptions]="[10, 20,50, 100]" aria-label="Select page of users"></mat-paginator>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
</div>

                Nombre: <span>{{values.nombre}}</span> 
            </mat-card-title>
          </mat-card-header>
          <hr class="car_cls-hr">
          <mat-card-content>

              <li class="car_ulli">
                <mat-icon style="font-size: 21px;">arrow_right</mat-icon> 
                <span class="car_lispan">Tipo:&nbsp;</span> {{values.tipo}}
              </li> 
            </ul> -->
          </mat-card-content>
          <mat-card-actions  class="car_footer"  style="border-radius: 0px 0px 8px 8px;" >
            <!-- <div style="display: flex;justify-content: space-evenly;" *ngIf="values.active === 1; else deleteTemplatemov"> -->
