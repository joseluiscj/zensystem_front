<div class="param-dialog-container">
  <div class="dialog-header">
    <div class="dialog-header-left">
      <div class="header-icon-box">
        <mat-icon>settings_suggest</mat-icon>
      </div>
      <div>
        <h3 class="dialog-title">Configurar Parámetros de Almacén</h3>
        <p class="dialog-subtitle">{{ producto.nombre }}</p>
      </div>
    </div>
    <button type="button" class="btn-close-dialog" (click)="cerrar()" [disabled]="cargando">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-progress-bar *ngIf="cargando" mode="indeterminate" class="header-loader"></mat-progress-bar>

  <form [formGroup]="productoForm" (ngSubmit)="guardar()" class="dialog-body">

    <!-- CODIGO SKU Y UNIDAD DE MEDIDA -->
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-6">
        <label class="form-label-custom">Código SKU / Barra: *</label>
        <mat-form-field appearance="outline" class="w-100 custom-field">
          <input matInput formControlName="codigo" placeholder="Ej: BEB-001">
          <mat-icon matPrefix class="prefix-icon">qr_code</mat-icon>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label-custom">Unidad de Medida: *</label>
        <mat-form-field appearance="outline" class="w-100 custom-field">
          <mat-select formControlName="unidadMedida">
            <mat-option *ngFor="let u of unidadesMedida" [value]="u">
              {{ u }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- STOCK MINIMO Y COSTO -->
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-6">
        <label class="form-label-custom">Stock Mínimo (Alerta de Reorden): *</label>
        <mat-form-field appearance="outline" class="w-100 custom-field">
          <input matInput type="number" step="1" min="0" formControlName="stockMinimo">
          <mat-icon matPrefix class="prefix-icon">warning_amber</mat-icon>
        </mat-form-field>
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label-custom">Costo de Compra ($): *</label>
        <mat-form-field appearance="outline" class="w-100 custom-field">
          <input matInput type="number" step="0.01" min="0" formControlName="costo">
          <span matPrefix class="px-1 text-muted">$</span>
        </mat-form-field>
      </div>
    </div>

    <!-- UBICACIÓN FÍSICA -->
    <div class="mb-3">
      <label class="form-label-custom">Ubicación Física en Almacén:</label>
      <mat-form-field appearance="outline" class="w-100 custom-field">
        <input matInput formControlName="ubicacion" placeholder="Ej: Estante B-2, Refrigerador 1, Barra principal">
        <mat-icon matPrefix class="prefix-icon">place</mat-icon>
      </mat-form-field>
    </div>

    <div class="info-alert-box">
      <mat-icon>info</mat-icon>
      <span>El stock mínimo activará alertas visuales automáticas cuando el inventario disponible sea menor o igual a este valor.</span>
    </div>

    <div class="dialog-footer">
      <button type="button" class="btn-cancel" (click)="cerrar()" [disabled]="cargando">
        Cancelar
      </button>
      <button type="submit" class="btn-submit" [disabled]="cargando || productoForm.invalid">
        <mat-icon>save</mat-icon>
        <span>Guardar Cambios</span>
      </button>
    </div>
  </form>
</div>
