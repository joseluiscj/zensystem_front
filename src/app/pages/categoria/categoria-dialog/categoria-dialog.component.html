<mat-dialog-content class="cl_model">
    <div class="modal_div_cab_title">
        <div class="card-title-text" style="font-weight: 500;">
            Gestión de Categoría
        </div> 
        <div class="modal_close_tile" (click)="close()" >
            <mat-icon>close</mat-icon>
        </div> 
    </div> 
    <mat-divider></mat-divider>  
    <div class="example-container mt-3">
        <div style="text-align: center;margin-bottom: 5px;font-size: 11px;" *ngIf="ocultar">
            <span>
                <b><i class="fas fa-spinner fa-spin" ></i> Cargando datos...</b>
            </span>
        </div>
        <form [formGroup]="basicForm"> 
            <div class="row wrap">
                <div class="col-md-12">  
                    <mat-form-field appearance="outline"  class="custom-input">
                        <mat-label class="labeltext">Nombre</mat-label>
                        <input matInput placeholder="" name="nombre" formControlName="nombre" autocomplete="off" class="uppercase">
                        <mat-hint *ngIf="basicForm.controls['nombre'].hasError('minlength') && basicForm.controls['nombre'].touched"
                            class="form-error-msg"> Se requiere al menos {{basicForm.controls['nombre'].errors?.["minlength"]?.requiredLength}} caracteres.
                        </mat-hint>
                        <mat-hint *ngIf="basicForm.controls['nombre'].hasError('maxlength') && basicForm.controls['nombre'].touched"
                            class="form-error-msg"> No puede contener más de {{basicForm.controls['nombre'].errors?.["maxlength"]?.requiredLength}} caracteres.
                        </mat-hint>
                        <mat-hint *ngIf="basicForm.controls['nombre'].hasError('required') && basicForm.controls['nombre'].touched"
                            class="form-error-msg"> El campo es obligatorio.
                        </mat-hint>
                    </mat-form-field>
                  
                </div> 
            </div>
            <div class="button-container">
                <hr>
                <button mat-raised-button type="button" color="accent" (click)="close()" class="btn_secondary">
                    <mat-icon>close</mat-icon> Cancelar
                </button>
                <button type="submit" mat-raised-button color="primary" (click)="save()" [disabled]="isButtonDisabled" style="margin-left: 5px; background-color: #cc8431;" >
                    <mat-icon>save</mat-icon><i class="fas fa-spinner fa-spin" *ngIf="isButtonDisabled"></i> Guardar
                </button>
            </div>
        </form>
    </div>      
</mat-dialog-content>
